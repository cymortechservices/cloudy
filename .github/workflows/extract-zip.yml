name: Extract Cloudy zip

on:
  push:
    branches: [main]
    paths: ['cloudy-full.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into repo root
        run: |
          unzip -q -o cloudy-full.zip -d .
          # safety: never commit secrets
          find . -name ".env" -not -path "./node_modules/*" -delete

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: extract cloudy-full.zip [skip ci]"
          git push
